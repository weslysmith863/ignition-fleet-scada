# Secret scan: for every push to main and every pull request, gitleaks reads the whole git history, not only the newest
# commit, and fails the run if any commit contains something that looks like a credential. This repo is public, and a
# secret that was ever committed is public even after a later commit removes it, so history is what has to be clean.
#
# CI has no .env, so this cannot look for your own secret values the way scripts/check_secrets.py does in the pre-commit
# hook; it looks for the shapes credentials have. The two checks cover different things, so both stay. Gitleaks's settings
# are in .gitleaks.toml at the repo root (found automatically): all its default rules plus one for the Ignition API token
# shape, which the default rules do not catch.
#
# gitleaks is downloaded as a pinned release (v8.30.1, published 2026-03-21, more than 14 days before it was pinned on
# 2026-10-14) and checked against its SHA-256 before it runs. If the file at that address ever changes, the check fails and
# gitleaks never runs. --redact keeps a found secret out of the log, because the log of a public repo is public too.
# The checkout action is pinned to a full commit for the same reason as in tests.yml.
name: secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the newest one
          persist-credentials: false
      - name: Download gitleaks and check it against the pinned SHA-256
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --redact --verbose --no-banner
