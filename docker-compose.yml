# Hub gateway, two site gateways, PostgreSQL, and a plant simulator for each site.
# See docs/layer-cards/00-platform-skeleton.md, docs/adr/0002, 0003, 0013, and 0014.
name: ignition-fleet-scada

x-gateway: &gateway
  image: inductiveautomation/ignition:${IGNITION_IMAGE_TAG:-8.3.9}
  restart: unless-stopped
  environment: &gateway-env
    # Auto-commissioning needs all four of these (platform environment variables reference, 8.3).
    ACCEPT_IGNITION_EULA: ${ACCEPT_IGNITION_EULA}
    IGNITION_EDITION: ${IGNITION_EDITION:-standard}   # standard = trial mode; maker needs a license key and token
    GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME}
    GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD}
    DISABLE_QUICKSTART: "true"
    TZ: ${TZ:-America/Chicago}

services:
  hub:
    <<: *gateway
    # -n sets the gateway system name, -m sets max JVM memory in MB
    command: ["-n", "hub", "-m", "1024"]
    environment:
      <<: *gateway-env
      # Maker leased license for this gateway (one key and token per gateway). Values live in .env only.
      IGNITION_LICENSE_KEY: ${HUB_LICENSE_KEY:-}
      IGNITION_ACTIVATION_TOKEN: ${HUB_ACTIVATION_TOKEN:-}
      # The hub only accepts Gateway Network connections from gateways on this list. The hub stores the list in its own
      # settings, and it re-read this one when it restarted with a longer list (Phase 2 finding 48).
      GATEWAY_NETWORK_SECURITYPOLICY: SpecifiedList
      GATEWAY_NETWORK_WHITELIST: site1,site2
      # DEV ONLY (see docs/adr/0004): allow plaintext Gateway Network on the private Compose network.
      # Phase 0 found the SSL link fails until the site trusts the hub's self-signed certificate.
      GATEWAY_NETWORK_REQUIRESSL: "false"
    ports:
      # 8088 is already used by the DosingControl gateway on this PC.
      # Bound to loopback so the plaintext dev gateways are reachable from this PC only (docs/adr/0004).
      - "127.0.0.1:8090:8088"
    volumes:
      - hub-data:/usr/local/bin/ignition/data

  site1:
    <<: *gateway
    command: ["-n", "site1", "-m", "1024"]
    environment:
      <<: *gateway-env
      IGNITION_LICENSE_KEY: ${SITE1_LICENSE_KEY:-}
      IGNITION_ACTIVATION_TOKEN: ${SITE1_ACTIVATION_TOKEN:-}
      # Outbound Gateway Network connection from the site to the hub (service name resolves on the Compose network).
      GATEWAY_NETWORK_0_HOST: hub
      # DEV ONLY (see docs/adr/0004): plaintext link to the hub's HTTP port. SSL would use 8060.
      GATEWAY_NETWORK_0_PORT: "8088"
      GATEWAY_NETWORK_0_ENABLESSL: "false"
      GATEWAY_NETWORK_0_DESCRIPTION: site1 to hub
    ports:
      - "127.0.0.1:8091:8088"
    volumes:
      - site1-data:/usr/local/bin/ignition/data
      # SPIKE (disabled): Git-tracked project folder bind-mounted into the data volume.
      # It only works if the volume was seeded by a first boot WITHOUT this line. On a brand-new volume,
      # Docker creates projects/ as root, the gateway cannot write there, and it FAULTS. See spike notes.
      # - ./ignition/projects/gitspike:/usr/local/bin/ignition/data/projects/gitspike

  # The second site gateway (ADR 0014 decision 1). It needs its own Maker license: put SITE2_LICENSE_KEY and
  # SITE2_ACTIVATION_TOKEN in .env BEFORE the first start, because the edition is fixed at a gateway's first boot and a
  # gateway that starts without its license may need its volume wiped.
  site2:
    <<: *gateway
    command: ["-n", "site2", "-m", "1024"]
    environment:
      <<: *gateway-env
      IGNITION_LICENSE_KEY: ${SITE2_LICENSE_KEY:-}
      IGNITION_ACTIVATION_TOKEN: ${SITE2_ACTIVATION_TOKEN:-}
      GATEWAY_NETWORK_0_HOST: hub
      # DEV ONLY (see docs/adr/0004): plaintext link to the hub's HTTP port, as for site1.
      GATEWAY_NETWORK_0_PORT: "8088"
      GATEWAY_NETWORK_0_ENABLESSL: "false"
      GATEWAY_NETWORK_0_DESCRIPTION: site2 to hub
    ports:
      - "127.0.0.1:8092:8088"
    volumes:
      - site2-data:/usr/local/bin/ignition/data

  # Relational store: tag history, alarm journal, downtime, Event Streams output (ADR 0001, design decision D8).
  # Reachable from the gateways as postgres:5432 on the Compose network, and from this PC on localhost only.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The plant simulator (ADR 0013): SunSpec Modbus TCP on 15020 and the OPC UA plant controller on 14840, one program, one
  # clock. Gateways reach it as sim:15020 and sim:14840 on the Compose network. The ports are also published on this PC's
  # loopback so tools on the PC can reach it. SIM_START (optional, from .env) pins the simulated start time.
  sim:
    build:
      context: .
      dockerfile: sim/Dockerfile
    restart: unless-stopped
    environment:
      SIM_START: ${SIM_START:-}
      TZ: ${TZ:-America/Chicago}
    ports:
      - "127.0.0.1:15020:15020"
      - "127.0.0.1:14840:14840"
    healthcheck:
      # Healthy when both the Modbus and the OPC UA port accept a connection.
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', p), 3).close() for p in (15020, 14840)]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The second plant (ADR 0014 decisions 2 and 3): the same image as sim, shaped by settings into six 1250 kW inverters
  # (7.5 MWac) with its own cloud seed. Units 1 to 6 are the inverters, 7 the weather station, 8 the meter (decision 9). Inside
  # its own container it listens on the same ports as sim, so site2 reaches it as sim2:15020 and sim2:14840. The ports are
  # published on this PC's loopback as 15021 and 14841.
  sim2:
    build:
      context: .
      dockerfile: sim/Dockerfile
    restart: unless-stopped
    environment:
      SIM_START: ${SIM_START:-}
      SIM_INVERTERS: "6"
      SIM_INVERTER_KW: "1250"
      SIM_SEED: "2"
      TZ: ${TZ:-America/Chicago}
    ports:
      - "127.0.0.1:15021:15020"
      - "127.0.0.1:14841:14840"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', p), 3).close() for p in (15020, 14840)]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

# Named volumes keep gateway state (config, projects, license) and database files across container recreation.
volumes:
  hub-data:
  site1-data:
  site2-data:
  postgres-data:
