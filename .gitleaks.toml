# Extra rules for the gitleaks secret scan (.github/workflows/secret-scan.yml). Gitleaks loads this file by itself when it
# scans the repo: it looks for .gitleaks.toml in the folder it scans. useDefault keeps all of gitleaks's own rules; the rules
# below add what they miss. The pre-commit hook (scripts/check_secrets.py) still checks your own .env values, which CI cannot.
title = "fleet-scada gitleaks rules"

[extend]
useDefault = true

[[rules]]
id = "ignition-api-token"
description = "Ignition gateway API token, written name:secret"
# The same shape as the "token" check in scripts/check_secrets.py: a key name, a colon, then 40 or more letters, digits,
# hyphens or underscores. The part after the colon must also look random, so harmless lookalikes do not trip it: 4.2 or
# more bits per character. Measured: the real tokens 4.8 to 5.1 and random 43-character tokens never below 4.3 (20,000
# tries), against about 3.9 for readable text and at most 4.0 for a sha256 digest (a Docker image pin).
regex = '''[A-Za-z0-9_-]{4,}:([A-Za-z0-9_-]{40,})'''
secretGroup = 1
entropy = 4.2

[[rules]]
id = "ignition-activation-token"
description = "Ignition license activation token, one long string that starts with eyJ"
# Measured on the real ones: a single unbroken string of 2,248 letters, digits, hyphens and underscores that starts with
# eyJ (the encoding of a JSON header) and has no dots. The default rules found none of 80 planted tokens of this shape;
# a guess is that their generic rule stops reading a value at 150 characters. The same idea as the "jwe" check in
# scripts/check_secrets.py, but 200 characters in a row are required, so an ordinary short JWT header is left alone, and
# 4.5 or more bits per character, so a long run of one letter is not flagged (the real ones measure 5.6).
regex = '''eyJ[A-Za-z0-9_-]{200,}'''
entropy = 4.5
